# conda env create -f pytorch-course.yml
name: pytorch-course
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # GPU-enabled PyTorch stack
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # Scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - torchmetrics
  - transformers
  - opencv

  # Extras
  - fastai
  - optuna
  - matplotlib
  - tqdm
  - spyder
  - directory-tree
  - ipywidgets
  - seaborn
  - lightning
  - torchinfo
  - scikit-image
  
  # Jupyter support
  - jupyterlab
  - notebook
  - ipykernel
  - nb_conda_kernels

  - pip
