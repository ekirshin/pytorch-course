# conda env create -f pytorch-course_cuda13.yml
name: pytorch-course
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
    
  # Scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - torchmetrics
  - transformers
  - opencv
  
  # Extras
  - fastai
  - optuna
  - matplotlib
  - tqdm
  - spyder
  - directory-tree
  - ipywidgets
  - seaborn
  - lightning
  - torchinfo
  - scikit-image
  
  # Jupyter support
  - jupyterlab
  - notebook
  - ipykernel
  - nb_conda_kernels

  - pip
  - pip:
      - --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cu131
